<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador OC</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Gerador OC</h2>
        <label for="cliente">Nome do Cliente:</label>
        <input type="text" id="cliente" placeholder="Digite o nome do cliente">

        <label for="valor">Valor (R$):</label>
        <input type="number" id="valor" placeholder="0,00">

        <button onclick="gerarOC()">Gerar</button>
    </div>

    <script>
        function gerarOC() {
            const cliente = document.getElementById('cliente').value;
            const valor = document.getElementById('valor').value;
            if (!cliente || !valor) {
                alert('Por favor, preencha todos os campos!');
                return;
            }
            alert(`OC gerada com sucesso para ${cliente} no valor de R$ ${valor}!`);
        }
    </script>

</body>
</html>
