<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrogrãos Corretora - Gerador de Ordem de Carregamento</title>
  
  <!-- Configurações para transformar em App (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agrogrãos">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 15px; box-shadow: none !important; border: none !important; }
      .no-print { display: none !important; }
    }
    .a4-preview { width: 100%; max-width: 210mm; min-height: 297mm; background: white; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.15); padding: 10mm 10mm; font-family: 'Arial', sans-serif; overflow-x: auto; }
    @media (min-width: 768px) {
      .a4-preview { padding: 15mm 15mm; }
    }
    input, textarea, select { transition: all 0.2s ease; }
    input:focus, textarea:focus, select:focus { outline: 2px solid #15803d; border-color: transparent; }
    .campo-oculto { display: none !important; }
    .veiculo-table th, .veiculo-table td { padding: 3px 4px; font-size: 11px; word-break: break-word; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col">

  <!-- Cabecalho do Sistema -->
  <header class="bg-gradient-to-r from-green-900 via-green-800 to-green-950 text-white shadow-lg no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-3 text-center sm:text-left">
        <div class="bg-amber-400 p-2 sm:p-2.5 rounded-xl text-green-900 font-bold text-xl sm:text-2xl flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 flex-shrink-0">
          <i class="fa-solid fa-wheat-awn"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg sm:text-2xl tracking-wide text-amber-300">AGROGRÃOS CORRETORA</h1>
          <p class="text-xs sm:text-sm text-green-200">Gerador &amp; Leitor de Ordens de Carregamento</p>
        </div>
      </div>
      <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto justify-center">
        <button onclick="document.getElementById('pdf-upload').click()" class="bg-amber-500 hover:bg-amber-400 text-green-950 font-bold px-3 sm:px-5 py-2 sm:py-2.5 rounded-xl shadow transition flex items-center gap-2 text-xs sm:text-base flex-1 sm:flex-none justify-center">
          <i class="fa-solid fa-file-pdf"></i> Ler PDF
        </button>
        <input type="file" id="pdf-upload" accept="application/pdf" class="hidden" onchange="processarPDF(this)">
        <button onclick="window.print()" class="bg-green-600 hover:bg-green-500 text-white font-bold px-4 sm:px-6 py-2 sm:py-2.5 rounded-xl shadow transition flex items-center gap-2 text-xs sm:text-base flex-1 sm:flex-none justify-center">
          <i class="fa-solid fa-print"></i> Gerar PDF
        </button>
      </div>
    </div>
  </header>

  <!-- Conteudo Principal -->
  <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 sm:py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">

    <!-- Lado Esquerdo: Formulario de Edicao -->
    <div class="lg:col-span-6 space-y-4 sm:space-y-5 no-print bg-white p-4 sm:p-6 rounded-2xl shadow-md border border-gray-200 h-fit">
      <div class="border-b pb-3 flex justify-between items-center">
        <h2 class="text-lg sm:text-xl font-bold text-green-900 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square"></i> Editar Informações
        </h2>
        <span class="text-xs sm:text-sm text-gray-500 font-medium">Altere o que precisar</span>
      </div>

      <!-- Importacao de PDF -->
      <div class="bg-green-50 border border-green-300 p-3 sm:p-4 rounded-xl text-xs sm:text-sm text-green-900 flex items-center justify-between">
        <div>
          <strong class="block font-bold text-sm sm:text-base">Instrução de Importação:</strong>
          <span>Envie o PDF recebido para preenchimento automático.</span>
        </div>
        <i class="fa-solid fa-upload text-green-600 text-xl sm:text-2xl"></i>
      </div>

      <!-- Alterar Imagem da Logo Opcao -->
      <div class="bg-amber-50 border border-amber-300 p-3 rounded-xl text-xs text-amber-900 flex items-center justify-between">
        <div>
          <strong class="block font-bold">Logo do Documento:</strong>
          <span>Salva automaticamente no navegador.</span>
        </div>
        <button onclick="document.getElementById('logo-upload').click()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow">
          Carregar Logo
        </button>
        <input type="file" id="logo-upload" accept="image/*" class="hidden" onchange="carregarNovaLogo(this)">
      </div>

      <form id="ordem-form" class="space-y-4 sm:space-y-5 text-sm" onsubmit="return false;">
        
        <!-- Numero do Documento e Data -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 bg-gray-50 p-3 sm:p-4 rounded-xl border border-gray-200">
          <div>
            <label class="font-bold text-gray-800 block mb-1 text-xs sm:text-sm">Nº da Ordem</label>
            <input type="text" id="in-numero" class="w-full p-2.5 sm:p-3 text-base border-2 border-gray-300 rounded-lg font-mono font-bold text-blue-800" value="02941" oninput="atualizarPreview()">
          </div>
          <div>
            <label class="font-bold text-gray-800 block mb-1 text-xs sm:text-sm">Data de Emissão</label>
            <input type="text" id="in-data" class="w-full p-2.5 sm:p-3 text-xs sm:text-sm border-2 border-gray-300 rounded-lg font-medium" value="PALMAS/TO: quarta-feira, 14 de outubro de 2026" oninput="atualizarPreview()">
          </div>
        </div>

        <!-- Dados do Cliente -->
        <div id="bloco-cliente" class="border-2 border-gray-200 rounded-xl p-3 sm:p-4 space-y-3 bg-gray-50 relative">
          <div class="flex justify-between items-center border-b pb-1.5">
            <h3 class="font-bold text-green-900 uppercase text-xs sm:text-sm flex items-center gap-1.5">
              <i class="fa-solid fa-user-tie"></i> Dados do Cliente
            </h3>
            <button type="button" onclick="alternarBloco('bloco-cliente', 'row-out-cliente')" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 text-xs rounded border border-red-200 bg-white" title="Excluir/Ocultar bloco">
              <i class="fa-solid fa-xmark"></i> Excluir Bloco
            </button>
          </div>
          <div id="wrap-in-fornecedor">
            <div class="flex justify-between items-center mb-1">
              <label class="text-gray-700 font-semibold">Cliente</label>
              <button type="button" onclick="ocultarCampo('wrap-in-fornecedor', 'wrap-out-fornecedor')" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-xmark"></i> Excluir campo</button>
            </div>
            <input type="text" id="in-fornecedor" class="w-full p-2.5 text-sm sm:text-base border border-gray-300 rounded-lg font-medium" value="BR3 AGRONEGOCIOS LTDA" oninput="atualizarPreview()">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div id="wrap-in-fornecedor-fones">
              <div class="flex justify-between items-center mb-1">
                <label class="text-gray-700 font-semibold">Telefones</label>
                <button type="button" onclick="ocultarCampo('wrap-in-fornecedor-fones', 'wrap-out-fornecedor-fones')" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-xmark"></i> Excluir campo</button>
              </div>
              <input type="text" id="in-fornecedor-fones" class="w-full p-2.5 text-sm sm:text-base border border-gray-300 rounded-lg" value="(77) 8114-4307" oninput="atualizarPreview()">
            </div>
            <div id="wrap-in-fornecedor-cep">
              <div class="flex justify-between items-center mb-1">
                <label class="text-gray-700 font-semibold">CEP</label>
                <button type="button" onclick="ocultarCampo('wrap-in-fornecedor-cep', 'wrap-out-fornecedor-cep')" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-xmark"></i> Excluir campo</button>
              </div>
              <input type="text" id="in-fornecedor-cep" class="w-full p-2.5 text-sm sm:text-base border border-gray-300 rounded-lg" value="77.320-000" oninput="atualizarPreview()">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2 sm:gap-3">
            <div class="col-span-2" id="wrap-in-fornecedor-cidade">
              <div class="flex justify-between items-center mb-1">
                <label class="text-gray-700 font-semibold">Cidade</label>
                <button type="button" onclick="ocultarCampo('wrap-in-fornecedor-cidade', 'wrap-out-fornecedor-cidade')" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-xmark"></i> Excluir campo</button>
              </div>
              <input type="text" id="in-fornecedor-cidade" class="w-full p-2.5 text-sm sm:text-base border border-gray-300 rounded-lg" value="Taguatinga" oninput="atualizarPreview()">
            </div>
            <div id="wrap-in-fornecedor-uf">
              <div class="flex justify-between items-center mb-1">
                <label class="text-gray-700 font-semibold">UF</label>
                <button type="button" onclick="ocultarCampo('wrap-in-fornecedor-uf', 'wrap-out-fornecedor-uf')" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-xmark"></i> Excluir</button>
              </div>
              <input type="text" id="in-fornecedor-uf" class="w-full p-2.5 text-sm sm:text-base border border-gray-300 rounded-lg uppercase text-center font-bold" value="TO" oninput="atualizarPreview()">
            </div>
          </div>
          <div id="wrap-in-embarque">
            <div class="flex justify-between items-center mb-1">
              <label class="text-gray-700 font-semibold">Local de Embarque</label>
              <button type="button" onclick="ocultarCampo('wrap-in-embarque', 'wrap-out-embarque')" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-xmark"></i> Excluir campo</button>
            </div>
            <input type="text" id="in-embarque" class="w-full p-2.5 text-sm sm:text-base border border-gray-300 rounded-lg font-medium" value="CC: 0170/26 - FAZENDAS VALVERDE - NOVO ACORDO TO" oninput="atualizarPreview()">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div id="wrap-in-produto" class="relative">
              <div class="flex justify-between items-center mb-1">
                <label class="text-gray-700 font-semibold">Produto (Clique para opções)</label>
                <button type="button" onclick="ocultarCampo('wrap-in-produto', 'wrap-out-produto')" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-xmark"></i> Excluir
